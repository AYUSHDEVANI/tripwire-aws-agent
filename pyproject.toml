[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tripwire-aws-agent"
version = "0.1.0"
description = "Tripwire: Decision Cascade for Safe AWS Agents using Strands Decider 2B"
authors = [
    { name = "Ayush" },
    { name = "Abhishek" },
    { name = "Team Lead" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["aws", "guardrails", "strands-decider-2b", "bedrock", "ai-safety", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "requests>=2.31.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "plotly>=5.20.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
asyncio_mode = "auto"
